buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

apply plugin: 'dev.frozenmilk.sinister.sloth.load'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.brott.dev' } // Required for EasyOpenCV / OpenFTC dependencies
}

dependencies {
    implementation project(':FtcRobotController')

    // Replace ntcore with EasyOpenCV for local Logitech webcam processing
    implementation 'org.openftc:easyopencv:1.7.3'
}